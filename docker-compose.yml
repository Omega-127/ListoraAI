services:
  # ---------------------------------------------------------------------------
  # Database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: listora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bizlisting
      POSTGRES_PASSWORD: bizlisting_dev
      POSTGRES_DB: bizlisting
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bizlisting -d bizlisting"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Mock Listing Platforms (Maps A, Maps B, Directory C)
  # ---------------------------------------------------------------------------
  mock-platforms:
    build:
      context: .
      dockerfile: apps/mock-platforms/Dockerfile
    container_name: listora-mock-platforms
    restart: unless-stopped
    ports:
      - "4100:4100"
    environment:
      - NODE_ENV=development
      - PORT=4100

  # ---------------------------------------------------------------------------
  # Backend API
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: listora-api
    restart: unless-stopped
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      mock-platforms:
        condition: service_started
    environment:
      - NODE_ENV=development
      - PORT=4000
      - DATABASE_URL=postgresql://bizlisting:bizlisting_dev@postgres:5432/bizlisting
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-your-anthropic-api-key-here}
      - SESSION_SECRET=replace-with-a-long-random-string-at-least-32-chars-listora-ai
      - OWNER_EMAIL=owner@example.com
      - OWNER_PASSWORD_HASH=$2a$10$wT3wW8R1x55mQ2K1v1F6OuK7YtK0b4zY6R1x55mQ2K1v1F6OuK7Yt
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000
      - MOCK_PLATFORM_URLS=http://mock-platforms:4100

  # ---------------------------------------------------------------------------
  # Frontend Dashboard (Vite)
  # ---------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: listora-web
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - api
    environment:
      - VITE_API_BASE_URL=http://localhost:4000

volumes:
  pgdata:
