        fromService:
          type: web
          name: listora-mock-platforms
          property: hostport

  # ---------------------------------------------------------------------------
  # 2. Mock Listing Platforms
  # ---------------------------------------------------------------------------
  - type: web
    name: listora-mock-platforms
    runtime: node
    plan: free
    region: oregon
    rootDir: .
    buildCommand: npm install --include=dev && npm run build:mock
    startCommand: node apps/mock-platforms/dist/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000

