# Render Blueprint Specification for ListoraAI
# See ARCHITECTURE.md §7 for full deployment topology.
databases:
  - name: listora-postgres
    databaseName: bizlisting
    user: bizlisting
    plan: free
    region: oregon
    ipAllowList: []

services:
  # ---------------------------------------------------------------------------
  # 1. Backend Express API
  # ---------------------------------------------------------------------------
  - type: web
    name: listora-api
    runtime: node
    plan: free
    region: oregon
    rootDir: .
    buildCommand: npm install --include=dev && npm run build:api
    startCommand: npx prisma migrate deploy --schema=apps/api/prisma/schema.prisma && npx tsx apps/api/prisma/seed.ts && node apps/api/dist/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: listora-postgres
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: OWNER_EMAIL
        value: owner@example.com
      - key: OWNER_PASSWORD_HASH
        value: '$2a$10$wT3wW8R1x55mQ2K1v1F6OuK7YtK0b4zY6R1x55mQ2K1v1F6OuK7Yt'
      - key: CORS_ORIGINS
